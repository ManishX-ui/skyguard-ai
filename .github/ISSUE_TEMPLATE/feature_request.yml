name: Feature Request
description: Suggest an idea or enhancement for SkyGuard AI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to SkyGuard AI!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: e.g. I am frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you have evaluated.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, diagrams, or references here.
